name: Deploy Randomquotes to AWS

on:
  push:
    branches: [main]
    paths:
      - "randomquotes/**"
      - ".github/workflows/deploy-randomquotes.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: randomquotes-juan-garcia
  ECS_CLUSTER: randomquotes-cluster-juan-garcia
  ECS_SERVICE: randomquotes-service-juan-garcia

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: randomquotes
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR login
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:latest .
          docker push $REGISTRY/$ECR_REPOSITORY:latest

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE
